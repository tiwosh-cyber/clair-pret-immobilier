name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-FRONTEND
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01-FRONTEND/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase start -x studio,mailpit,imgproxy,vector,logflare,supavisor,storage-api,realtime,edge-runtime,postgres-meta
      - run: supabase test db
      - run: bash 08-TESTS/security/api001-concurrency.sh
      - name: API surface (TEST-018)
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          API_URL=$API_URL ANON_KEY=$ANON_KEY node --test 08-TESTS/security/api-surface.test.mjs
